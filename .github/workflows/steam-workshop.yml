name: Music Uploads scaffold CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: music-uploads-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ABR_RADIO_MOD: ${{ github.workspace }}/.radio-framework/Contents/mods/ApocalipseBRRadio
      AMP_MUSIC_MOD: ${{ github.workspace }}/.music-pack/Apocalipse-Music-Pack
      PZ_BUILD_ROOT: ${{ runner.temp }}/music-uploads-build
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: false
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ApocalipseBr/ApocalipseBRRadio
          ref: 4d0ac709396101ea078f05aee7afc7f567277458
          path: .radio-framework
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ApocalipseBr/Apocalipse-Music-Pack
          ref: master
          path: .music-pack
          lfs: false
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install imageio-ffmpeg==0.6.0
      - run: npm ci
      - run: git lfs fsck
      - run: npm test
      - run: npm run build
      - run: npm run test:build
